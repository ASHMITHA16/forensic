[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "correlation-reasoning-agent"
version = "1.0.0"
description = "Deterministic cross-domain correlation and reasoning agent for a multi-agent digital forensics framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# No runtime dependencies, like the memory agent: it must run on a bare
# Python install. AutoGen is optional and imported lazily by the adapter.
dependencies = []

[project.optional-dependencies]
autogen = ["pyautogen>=0.2"]

[project.scripts]
correlation-agent = "correlation_agent.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["correlation_agent*"]
